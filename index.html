<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虎妖 AI 条件反馈工具</title><style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#202b3b;--muted:#697586;--line:#e3e8ef;--rust:#985039;--soft:#f8eee9;--green:#28745c;--amber:#a46a16;--red:#a84343;--shadow:0 8px 28px #23334c0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:30px 20px 50px}.top{margin-bottom:20px}.eyebrow{color:var(--rust);font-size:12px;font-weight:700;letter-spacing:.1em}.top h1{font-size:27px;margin:4px 0}.top p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr .9fr;gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:21px}.card h2{font-size:17px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted);margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field select{height:41px;width:100%;border:1px solid #d8dee8;background:white;border-radius:9px;padding:0 10px;font:inherit;color:var(--ink)}.group{padding-bottom:18px;margin-bottom:17px;border-bottom:1px solid var(--line)}.group:last-of-type{border:0;margin-bottom:0;padding-bottom:0}.actions{display:flex;gap:9px;margin-top:19px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--rust);color:white}.secondary{background:#eef1f5;color:#344054}.out{position:sticky;top:16px}.outhead{display:flex;justify-content:space-between;align-items:center}.outhead h2{margin:0}.badge{font-size:12px;font-weight:700;color:var(--rust);background:var(--soft);border-radius:20px;padding:4px 10px}.decision{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:17px;margin:15px 0}.label{font-size:12px;color:var(--muted)}.decision strong{font-size:20px;display:block;margin-top:3px}.decision p{color:var(--muted);margin:5px 0 0}.out h3{font-size:13px;color:#475467;margin:17px 0 8px}.items{display:grid;gap:8px}.item{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:9px;padding:10px 12px}.item.warn{border-left-color:var(--amber)}.item.bad{border-left-color:var(--red)}.item b{font-size:13px}.item p{font-size:13px;color:var(--muted);margin:3px 0 0}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:4px 8px;font-size:12px}.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:15px}@media(max-width:820px){.grid{grid-template-columns:1fr}.out{position:static}}@media(max-width:520px){.fields{grid-template-columns:1fr}.wrap{padding:20px 12px}.top h1{font-size:23px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">AI DECISION SANDBOX</div><h1>虎妖 AI 条件反馈工具</h1><p>设置 8 项条件，查看虎妖当前行为反馈，并导出决策结果。</p></header><div class="grid"><section class="card">
<div class="group"><h2>目标感知</h2><p class="sub">判断虎妖是否掌握玩家位置，以及双方距离。</p><div class="fields">
<div class="field"><label for="visible">TargetVisible｜虎妖能否看见玩家</label><select id="visible"><option value="yes">能看见</option><option value="no">看不见</option></select></div>
<div class="field"><label for="aware">PlayerAwareOfTiger｜玩家是否察觉虎妖</label><select id="aware"><option value="no">未察觉</option><option value="yes">已察觉</option></select></div>
<div class="field"><label for="distance">TargetDistance｜虎妖与玩家距离</label><select id="distance"><option value="medium_far">中 / 远</option><option value="near">近</option><option value="pounce">扑击距离内</option><option value="unknown">未知</option></select></div>
<div class="field"><label for="reachable">TargetReachable｜玩家是否可达</label><select id="reachable"><option value="yes">可达</option><option value="no">不可达</option></select></div>
</div></div>
<div class="group"><h2>威胁与血量</h2><p class="sub">用于判断继续进攻的风险。</p><div class="fields">
<div class="field"><label for="threat">TargetThreat｜玩家威胁程度</label><select id="threat"><option value="acceptable">可接受</option><option value="high">高</option><option value="low">低</option></select></div>
<div class="field"><label for="damage">IncomingDamage｜虎妖是否正在受击</label><select id="damage"><option value="no">没有</option><option value="yes">正在受击</option></select></div>
<div class="field"><label for="health">HealthRatio｜虎妖血量比例</label><select id="health"><option value="high">高（＞60%）</option><option value="medium">中（30–60%）</option><option value="low">低（≤30%）</option></select></div>
</div></div>
<div class="group"><h2>寻路</h2><p class="sub">检查当前路径能否支持接近或进攻。</p><div class="fields"><div class="field"><label for="path">PathStatus｜路径状态</label><select id="path"><option value="valid">有效</option><option value="recalc">需要重算</option><option value="failed">失败</option></select></div></div></div>
<div class="actions"><button class="btn primary" id="export">导出决策结果</button><button class="btn secondary" id="copy">复制反馈</button><button class="btn secondary" id="reset">恢复默认</button></div>
</section><aside class="card out" aria-live="polite"><div class="outhead"><h2>当前决策反馈</h2><span class="badge" id="stage"></span></div><div id="result"></div><div class="note">这是规则讨论原型。扑击距离和血量分段可根据项目数值调整；NearbyAllies、GroupState 等已按当前设定排除。</div></aside></div></main>
<script>
const fields=['visible','aware','distance','reachable','threat','damage','health','path'];const names={visible:'虎妖能否看见玩家',aware:'玩家是否察觉虎妖',distance:'虎妖与玩家距离',reachable:'玩家是否可达',threat:'玩家威胁程度',damage:'虎妖是否正在受击',health:'虎妖血量比例',path:'路径状态'};const englishNames={visible:'TargetVisible',aware:'PlayerAwareOfTiger',distance:'TargetDistance',reachable:'TargetReachable',threat:'TargetThreat',damage:'IncomingDamage',health:'HealthRatio',path:'PathStatus'};const display={yes:'是',no:'否',medium_far:'中 / 远',near:'近',pounce:'扑击距离内',unknown:'未知',acceptable:'可接受',high:'高',medium:'中',low:'低',valid:'有效',recalc:'需重算',failed:'失败'};function v(id){return document.getElementById(id).value}function decide(){let a='',stage='',notes=[];const add=(kind,title,text)=>notes.push({kind,title,text});if(v('visible')==='no'){stage='搜索玩家';a=v('reachable')==='yes'?'前往最后目击位置搜索':'重新搜索目标位置';add('warn','当前看不见玩家','暂不直接发动攻击，依据最后目击信息重新定位。');}
else if(v('reachable')==='no'||v('path')==='failed'){stage='接近受阻';a='尝试重新寻路；持续不可达则放弃攻击';add('bad','路径不可用','玩家不可达或当前路径失败，停止重复执行原追击路线。');}
else if(v('path')==='recalc'){stage='重新规划路径';a='重算路径后继续接近';add('warn','路径需要重算','更新路径结果后再决定继续接近或放弃。');}
else if(v('damage')==='yes'&&v('health')==='low'){stage='高风险应对';a='停止进攻，优先脱离受击并拉开距离';add('bad','低血量且正在受击','当前生存风险较高，先避免继续承受伤害。');}
else if(v('threat')==='high'&&v('health')!=='high'){stage='谨慎应对';a='暂缓进攻，调整位置并重新评估';add('warn','威胁偏高','玩家威胁高且虎妖血量未处于高位，降低进攻倾向。');}
else if(v('aware')==='yes'){stage='玩家已察觉';if(v('distance')==='pounce'||v('distance')==='near'){a='解除潜行，主动发起正面攻击';add('warn','潜行条件已失效','玩家已察觉虎妖，转为正面战斗。');}else if(v('distance')==='medium_far'){a='放弃潜行，主动接近并进攻';add('warn','接近中被发现','不再执行潜行绕行，转入主动进攻。');}else{a='先重新确认玩家距离，再选择攻击方式';add('warn','距离未知','补足距离判断后再选择攻击行为。');}}
else if(v('distance')==='medium_far'){stage='潜行接近';a='保持潜行，接近玩家并寻找首次扑击时机';add('ok','玩家尚未察觉','目标可见且可达，保持潜行接近。');}
else if(v('distance')==='pounce'){stage='首次扑击';a='解除潜行，冲刺向前并扑向玩家';add('ok','进入扑击距离','玩家尚未察觉且路径有效，执行首次突袭扑击。');}
else if(v('distance')==='near'){stage='近距离判断';a='调整身位后发动短距离扑击';add('ok','玩家尚未察觉','距离较近，维持潜行并快速调整攻击角度。');}
else{stage='重新定位';a='确认玩家距离后再决定潜行接近或攻击';add('warn','距离未知','当前信息不足以判断接近方式。');}
if(v('damage')==='yes'&&!(v('health')==='low'&&v('damage')==='yes'))add('warn','虎妖正在受击','把当前受击状态纳入下一次行为评估。');return{stage,a,notes,conditions:Object.fromEntries(fields.map(k=>[names[k],display[v(k)]]))};}
function render(){let d=decide();document.getElementById('stage').textContent=d.stage;document.getElementById('result').innerHTML=`<div class="decision"><div class="label">行为输出</div><strong>${d.a}</strong><p>根据当前 8 项条件生成。</p></div><h3>反馈原因</h3><div class="items">${d.notes.map(n=>`<div class="item ${n.kind}"><b>${n.title}</b><p>${n.text}</p></div>`).join('')}</div><h3>当前条件</h3><div class="chips">${Object.entries(d.conditions).map(([k,x],i)=>`<span class="chip">${englishNames[fields[i]]}｜${k}：${x}</span>`).join('')}</div>`;}fields.forEach(id=>document.getElementById(id).addEventListener('change',render));function report(){let d=decide();return{title:'虎妖 AI 决策反馈',stage:d.stage,behavior:d.a,feedback:d.notes.map(({title,text})=>({title,detail:text})),conditions:d.conditions,exportedAt:new Date().toLocaleString('zh-CN')}}document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(report(),null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='虎妖AI决策反馈.json';a.click();URL.revokeObjectURL(u)};document.getElementById('copy').onclick=async()=>{const r=report(),s=`阶段：${r.stage}\n行为：${r.behavior}\n${r.feedback.map(x=>x.title+'：'+x.detail).join('\n')}`;try{await navigator.clipboard.writeText(s);alert('反馈已复制')}catch{alert(s)}};document.getElementById('reset').onclick=()=>{document.querySelectorAll('select').forEach(x=>x.selectedIndex=0);render()};render();
</script></body></html>
